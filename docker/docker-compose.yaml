services:
  ducklake_db:
    container_name: "ducklake_catalog"
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ducklake_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker-volumes/postgresql:/var/lib/postgresql:rw
    networks:
      - ducklake_network
  data-marts:
    container_name: "dest_db"
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    volumes:
      - ./docker-volumes/data-marts-postgres:/var/lib/postgresql:rw
    networks:
      - ducklake_network
  
  object-storage:
    container_name: "minio"
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console/Web UI port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./docker-volumes/minio/data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ducklake_network

    
