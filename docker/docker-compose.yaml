services:
  postgres_warehouse:
    container_name: "ducklake_catalog"
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - ~/docker-volumes/ducklake/pg_ducklake_catalog:/var/lib/postgresql:rw
      # - /mnt/e/docker-volumes/ducklake/postgres_warehouse:/var/lib/postgresql/18/data:rw
    networks:
      - ducklake_network
  
  object-storage:
    container_name: "minio"
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console/Web UI port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ~/docker-volumes/ducklake/minio/data:/data:rw
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ducklake_network

networks:
  ducklake_network:  
