services:
    object-storage:
        container_name: "minio"
        image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
        ports:
            - "9000:9000" # API port
            - "9001:9001" # Console/Web UI port
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: admin
        volumes:
            - /mnt/e/docker_volumes/minio-data:/data
        command: server /data --console-address ":9001"
        restart: unless-stopped
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3

    starrocks:
        image: starrocks/allin1-ubuntu:latest
        ports:
            - "9030:9030"
            - "8030:8030"
            - "8040:8040"
        volumes:
            - /mnt/e/docker_volumes/starrocks/meta:/data/deploy/starrocks/fe/meta
            - /mnt/e/docker_volumes/starrocks/fe_log:/data/deploy/starrocks/fe/log
            - /mnt/e/docker_volumes/starrocks/data:/data/deploy/starrocks/be/storage
            - /mnt/e/docker_volumes/starrocks/be_log:/data/deploy/starrocks/be/log

    metabase:
        image: metabase/metabase
        container_name: metabase
        ports:
            - "3000:3000"

volumes:
    # postgres-catalog:
    minio-data:
    starrocks:
