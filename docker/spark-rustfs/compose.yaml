services:
    spark-master:
        image: apache/spark:3.5.8
        container_name: spark-master
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        networks:
            - spark-network
        ports:
            - "8080:8080"
            - "7077:7077"
            - "4040:4040"
        restart: unless-stopped
        volumes:
            - spark-master-data:/opt/spark/work-dir
    spark-connect:
        image: apache/spark:3.5.8
        container_name: spark-connect
        depends_on:
            - spark-master
        command: >
            /opt/spark/bin/spark-submit
            --master spark://spark-master:7077
            --class org.apache.spark.sql.connect.service.SparkConnectServer
            --jars /opt/spark/jars/spark-connect_2.12-3.5.8.jar
            local:///opt/spark/jars/spark-connect_2.12-3.5.8.jar
        ports:
            - "15002:15002"
        networks:
            - spark-network

    spark-worker-1:
        image: apache/spark:3.5.8
        container_name: spark-worker-1
        depends_on:
            - spark-master
        networks:
            - spark-network
        command: >
            /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
            spark://spark-master:7077
        restart: unless-stopped
        environment:
            - SPARK_WORKER_MEMORY=8g
            - SPARK_WORKER_CORES=4
        volumes:
            - spark-worker-1-data:/opt/spark/work-dir

    # spark-worker-2:
    #     image: apache/spark:3.5.8
    #     container_name: spark-worker-2
    #     depends_on:
    #         - spark-master
    #     command: >
    #         /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
    #         spark://spark-master:7077
    #     environment:
    #         - SPARK_WORKER_MEMORY=2g
    #         - SPARK_WORKER_CORES=2
    #     volumes:
    #         - spark-worker-2-data:/opt/spark/work-dir

    rustfs:
        container_name: rustfs
        image: rustfs/rustfs:latest
        volumes:
            - /mnt/e/docker_volumes/rustfs/data:/data
        environment:
            RUSTFS_CONSOLE_ENABLE: true
            RUSTFS_ACCESS_KEY: admin
            RUSTFS_SECRET_KEY: admin
        ports:
            - "9000:9000" # API port
            - "9001:9001" # Console/Web UI port
        command: /data

networks:
    spark-network:
        driver: bridge
        ipam:
            config:
                - subnet: 172.20.0.0/16
                  gateway: 172.20.0.1

volumes:
    spark-master-data:
    spark-worker-1-data:
    # spark-worker-2-data:
