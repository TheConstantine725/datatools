services:
    spark-master:
        image: apache/spark:3.5.8
        container_name: spark-master
        command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
        ports:
            - "8080:8080"
            - "7077:7077"
            - "15002:15002"
        volumes:
            - spark-master-data:/opt/spark/work-dir

    spark-worker-1:
        image: apache/spark:3.5.8
        container_name: spark-worker-1
        depends_on:
            - spark-master
        command: >
            /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
            spark://spark-master:7077
        environment:
            - SPARK_WORKER_MEMORY=8g
            - SPARK_WORKER_CORES=4
        volumes:
            - spark-worker-1-data:/opt/spark/work-dir

    # spark-worker-2:
    #     image: apache/spark:3.5.8
    #     container_name: spark-worker-2
    #     depends_on:
    #         - spark-master
    #     command: >
    #         /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
    #         spark://spark-master:7077
    #     environment:
    #         - SPARK_WORKER_MEMORY=2g
    #         - SPARK_WORKER_CORES=2
    #     volumes:
    #         - spark-worker-2-data:/opt/spark/work-dir

    rustfs:
        container_name: rustfs
        image: rustfs/rustfs:latest
        volumes:
            - /mnt/e/docker_volumes/rustfs/data:/data
        environment:
            RUSTFS_CONSOLE_ENABLE: true
            RUSTFS_ACCESS_KEY: admin
            RUSTFS_SECRET_KEY: admin
        ports:
            - "9000:9000" # API port
            - "9001:9001" # Console/Web UI port
        command: /data

volumes:
    spark-master-data:
    spark-worker-1-data:
    # spark-worker-2-data:
