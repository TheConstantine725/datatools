sources.databases.rfam_database.credentials = "mysql+pymysql://rfamro@mysql-rfam-public.ebi.ac.uk:4497/Rfam"

[destination.ducklake.ingestion.credentials]
ducklake_name = "ingestion"
metadata_schema = "ingestion_ducklake"
catalog = "postgres://admin:admin@127.0.0.1:5432/ducklake"

[destination.ducklake.ingestion.credentials.storage]
bucket_url = "s3://ducklake/ingestion/v1"

[destination.ducklake.ingestion.credentials.storage.credentials]
endpoint_url = "http://127.0.0.1:9100"
aws_access_key_id = "admin" # RustFS
aws_secret_access_key = "admin" # RustFS
region_name = "us-east-1"
s3_url_style = "path"
s3_use_ssl = false

[destination.ducklake.ingestion.config]
parquet_compression = 'zstd'
parquet_compression_level = 6
parquet_version = 2
data_inlining_row_limit = 0
rewrite_delete_threshold = 0.95
expire_older_than = '7 days'
delete_older_than = '7 days'

[destination.s3]
bucket_url = "s3://deltalake"

[destination.s3.credentials]
aws_access_key_id = "admin" # copy the access key here
aws_secret_access_key = "admin" # copy the secret access key here
endpoint_url = "http://localhost:9100"

[destination.minio.kwargs]
use_ssl=false

[destination.clickhouse.test.credentials]
username = "admin"
password = "admin"
host = "localhost"
port = 9000
http_port = 8123
secure = 0
database = "data_landing"

[destination.clickhouse.test]
dataset_table_separator = "__"                         # The default separator for dataset table names from the dataset.
table_engine_type = "merge_tree"
