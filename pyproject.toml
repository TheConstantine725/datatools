[project]
name = "datatools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konstantinos Dimos", email = "konstadimos7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Database Connectivity
    "duckdb>=1.5.5",
    # "pymysql>=1.1.2",
    # "pyarrow>=18.0.0",
    # "datafusion>=53.0.0",
    "clickhouse-connect>=1.0.0",
    # dlt-deps
    "dlt[clickhouse,duckdb,ducklake,filesystem,s3]>=1.27.2",
    # dbt-deps
    "dbt-core>=1.11.11",
    "dbt-duckdb>=1.10.0",
    "dbt-clickhouse>=1.10.0",
    # dagster-deps
    "dagster>=1.13.12",
    "dagster-dlt>=0.29.12",
    "dagster-dbt>=0.29.12",
    "dagster-clickhouse>=0.29.12",
    "dagster-dg-cli>=1.13.12",
    "dagster-webserver>=1.13.12",
    "dagster-docker",
    "dagster-postgres",
    # Misc. Deps
    "python-dotenv>=1.2.1",
]

[project.scripts]
datatools = "datatools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyarrow-stubs>=20.0.0.20260625",
    ]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "datatools"
