[project]
name = "datatools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konstantinos Dimos", email = "konstadimos7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.3.2",
    "ibis>=3.3.0",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "pyarrow<=18.0.0",
    "deltalake",
    "sqlalchemy",
    "dbt-core>=1.10.15",
    "dbt-duckdb>=1.10.0",
    "python-dotenv>=1.2.1",
    "dlt[duckdb,ducklake]>=1.20.0",
    "pymysql>=1.1.2",
]

[project.scripts]
datatools = "datatools:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.18.4",
    "jupyterlab"
]
