[project]
name = "datatools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konstantinos Dimos", email = "konstadimos7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "deltalake",
    "sqlalchemy",
    "dbt-core>=1.10.15",
    "dbt-duckdb>=1.10.0",
    "python-dotenv>=1.2.1",
    "dlt[clickhouse,deltalake,duckdb,ducklake,filesystem,s3]>=1.20.0",
    "pymysql>=1.1.2",
    "pyspark==4.1.0",
    "pyarrow>=18.0.0",
]

[project.scripts]
datatools = "datatools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "marimo>=0.18.4",
    "jupyterlab>=4.5.7",
]
