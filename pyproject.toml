[project]
name = "datatools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konstantinos Dimos", email = "konstadimos7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4.2",
    "ibis>=3.3.0",
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "pyarrow>=22.0.0",
    "deltalake",
    "sqlalchemy",
    "dbt-core>=1.10.15",
    "dbt-duckdb>=1.10.0",
    "result>=0.17.0",
]

[project.scripts]
datatools = "datatools:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
