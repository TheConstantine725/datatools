[project]
name = "datatools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Konstantinos Dimos", email = "konstadimos7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "pandas>=2.3.3",
    "polars>=1.35.2",
    "deltalake",
    "sqlalchemy",
    "duckdb>=1.5.4",
    "pandas>=2.3.3",
    "dlt[clickhouse,duckdb,ducklake,filesystem,s3]>=1.27.2",
    "dbt-core>=1.11.11",
    "dbt-duckdb>=1.10.0",
    "python-dotenv>=1.2.1",
    "pymysql>=1.1.2",
    "pyarrow>=18.0.0",
    "datafusion>=53.0.0",
    "clickhouse-connect>=1.0.0",
    "dbt-clickhouse>=1.10.0",
    "dagster>=1.13.12",
    "dagster-webserver>=1.13.12",
    "dagster-dg-cli>=1.13.12",
]

[project.scripts]
datatools = "datatools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    # "marimo>=0.18.4",
    # "jupyterlab>=4.5.7",
]
